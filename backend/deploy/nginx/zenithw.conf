map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

limit_conn_zone $binary_remote_addr zone=zenithw_socket_per_ip:10m;
limit_req_zone $binary_remote_addr zone=zenithw_socket_handshake:10m rate=10r/s;

# The API origin is Cloudflare-only.  `$realip_remote_addr` retains the TCP
# peer before `real_ip_header` rewrites `$remote_addr`, so a visitor cannot
# bypass this gate by forging CF-Connecting-IP on a direct origin request.
geo $realip_remote_addr $zenithw_cloudflare_origin {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.zenithw.space;

    include /etc/nginx/snippets/cloudflare-real-ip.conf;
    if ($zenithw_cloudflare_origin = 0) { return 444; }
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.zenithw.space;

    include /etc/nginx/snippets/cloudflare-real-ip.conf;
    if ($zenithw_cloudflare_origin = 0) { return 444; }
    ssl_certificate /etc/ssl/cloudflare/api.zenithw.space.pem;
    ssl_certificate_key /etc/ssl/cloudflare/api.zenithw.space.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    client_max_body_size 95m;
    client_body_timeout 60s;
    client_header_timeout 30s;
    send_timeout 60s;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 660s;
    proxy_send_timeout 660s;

    limit_conn_status 429;
    limit_req_status 429;

    location /socket.io/ {
        limit_conn zenithw_socket_per_ip 12;
        limit_req zone=zenithw_socket_handshake burst=20 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

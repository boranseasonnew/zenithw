services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PORT: "8000"
      FLASK_ENV: production
      TRUST_PROXY: "1"
      ENABLE_ORIGIN_LOCK: "0"
      SELF_HOSTED_ORIGIN: "${SELF_HOSTED_ORIGIN}"
      YOUTUBE_WEB_ENABLED: "1"
    volumes:
      - zenithw-downloads:/app/backend/downloads
    expose:
      - "8000"
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  web:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${ZENITHW_PORT:-8080}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/runtime-config.js:/usr/share/nginx/html/runtime-config.js:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  zenithw-downloads:

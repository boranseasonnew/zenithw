            <p>Hazırlanan dosya bağlantıları tahmin edilmesi güç rastgele belirteçler kullanır, kısa süre geçerlidir, isteği başlatan IP adresine bağlıdır ve dosya aktarımı başladığında yeniden kullanılamaz. Aktif aktarım tamamlanana kadar dosya koruma altında tutulur; aktarım bittikten veya kesildikten sonra geçici dosya temizlenir.</p>

            <p>Cloudflare, Amazon Web Services ve diğer altyapı sağlayıcıları standart bağlantı ve güvenlik günlükleri oluşturabilir. Günlüklerin içeriği ve saklama süresi ilgili sağlayıcının işletim ve güvenlik politikalarına bağlı olabilir; ZenithW yalnızca operasyon için gerekli erişimi kullanır.</p>

        body: `
          <section class="info-section">
            <h2>At a glance</h2>
            <div class="feature-grid">
              <div class="mini-card"><span class="mini-card-number">01</span><h3>No account</h3><p>No email, password, or profile information is requested.</p></div>
              <div class="mini-card"><span class="mini-card-number">02</span><h3>Local history</h3><p>Download history stays in your own browser.</p></div>
              <div class="mini-card"><span class="mini-card-number">03</span><h3>Temporary files</h3><p>Processing files are not kept as a permanent content archive.</p></div>

          <section class="info-section">
            <h2>Data minimization and account-free use</h2>
            <p>You do not need to create an account, provide an email address, or build a user profile to use ZenithW. This means identity information that is not required to operate the service is not collected in the first place. We do not create payment or advertising profiles, correlate behavior between users, or sell personal data for advertising.</p>
            <p>When you start a job, only the source link, selected format, quality, and relevant processing options are sent to the server. They are used to perform the download, remux, or conversion and to diagnose technical failures.</p>
          </section>
          <section class="info-section">
            <h2>Links and source platforms</h2>
            <p>The media link you provide is submitted by the ZenithW server to the source platform to locate the requested content. The source platform and necessary technical providers may process standard network information and the requested URL under their own privacy policies.</p>
            <p>ZenithW validates addresses, redirects, and destination IPs to prevent a user-supplied link from reaching internal or local systems. Private, loopback, and link-local network destinations are blocked, and media tools are not allowed to open remote addresses as an independent download path.</p>
          </section>
          <section class="info-section">
            <h2>Temporary files and protected download links</h2>
            <p>Media and conversion files created during a job are not a permanent user archive. They remain in temporary storage only long enough to complete the operation and deliver the result, then enter short-lived link and scheduled cleanup workflows. Partial artifacts from expired, failed, or interrupted jobs are also covered by cleanup.</p>
            <p>Prepared-file links use hard-to-guess random tokens, expire quickly, are bound to the requesting IP address, and cannot be reused once transfer begins. An active file is protected until its transfer closes, after which interrupted or completed temporary data is removed.</p>
          </section>
          <section class="info-section">
            <h2>Connection and application security</h2>
            <p>The web interface and API are delivered over HTTPS. Shared origin verification between the interface and API helps reduce direct unauthorized backend access. Browser security headers restrict framing, content types, referrer exposure, unnecessary device permissions, and the sources from which executable content may load.</p>
            <p>File-size, duration, concurrency, temporary-storage, and request-rate limits protect both visitors and service availability. Conversion tools are restricted to local file protocols, while empty, invalid, or over-limit results are rejected rather than delivered as completed files.</p>
          </section>
          <section class="info-section">
            <h2>IP addresses, security logs, and abuse prevention</h2>
            <p>Your IP address and limited request details may be processed for rate limiting, concurrency control, prepared-file ownership, attack prevention, troubleshooting, and reliability. These details are used to protect the service, not to build a user profile.</p>
            <p>Cloudflare, Amazon Web Services, and other infrastructure providers may create standard connection and security logs. Their contents and retention periods may depend on each provider's operational and security policies; ZenithW uses access to them only when needed to operate and protect the service.</p>
          </section>
          <section class="info-section">
            <h2>Information that stays in your browser</h2>
            <p>Download history, language, theme, quality, and filename preferences may be stored in your browser's <strong>localStorage</strong>. They are not attached to a ZenithW account or synchronized by us across devices. Clearing site data in your browser also removes this local history and these preferences.</p>
            <p>The ZenithW application code <strong>does not use Google Analytics, advertising pixels, or behavioral-tracking scripts</strong>. Browser-stored preferences exist only to personalize the interface and provide local history; they are not used for ad targeting or cross-user profiling.</p>
          </section>
          <section class="info-section">
            <h2>Your rights, choices, and contact</h2>
            <p>Because there is no server-side user account, there is no permanent profile record to delete. You may still contact <a href="mailto:info@zenithw.space?subject=Privacy%20Request">info@zenithw.space</a> with questions about possible processing, correction or deletion requests, or other privacy matters. We request only the information needed to understand and respond to the request.</p>
            <div class="notice"><span class="notice-mark">i</span><span>No internet service can promise absolute security. ZenithW combines data minimization, short-lived files, network boundaries, access controls, and continuing security improvements to reduce risk. The latest policy is published here when the service or its providers change.</span></div>
          </section>`,

<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>İndirme geçmişi — ZenithW</title>
<meta name="description" content="Bu tarayıcıda saklanan ZenithW indirme geçmişi.">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" type="image/png" href="zenithw.png">
<link href="/fonts.css?v=1" rel="stylesheet">
<link rel="stylesheet" href="style.487d49f0164d.css">
<link rel="stylesheet" href="site-shell.css?v=14.4">
<link rel="stylesheet" href="premium-pages.css?v=1.0">
</head>
<body class="theme-default tool-page premium-tool-page history-page">
<main class="tool-page-main">
  <a class="tool-page-brand" href="/">ZenithW<span>.</span></a>
  <header class="premium-page-hero compact-page-hero">
    <div class="premium-kicker"><span></span>yalnızca bu tarayıcıda</div>
    <h1>İndirdiklerin,<br><span>kontrolün altında.</span></h1>
    <p>Son işlemlerine hızlıca dön, bağlantıyı kopyala veya aynı medyayı yeniden hazırla. Geçmiş hesabına ya da sunucuya kaydedilmez.</p>
    <div class="premium-proof-row"><span><i></i>yerel kayıt</span><span><i></i>tek tıkla yeniden indir</span></div>
  </header>
  <div class="upd-modal tool-page-panel history-panel">
    <div class="handle" style="margin:-6px auto 12px;"></div>
    <button class="modal-close-btn">✕</button>
    <div class="history-panel-head">
      <div><span>ARŞİV / LOCAL</span><div class="upd-title" id="historyTitle">indirme geçmişi</div></div>
      <div class="history-private-badge">sunucuya gönderilmez</div>
    </div>
    <div id="historyList" class="history-list-premium">
      <div style="text-align:center;padding:40px;color:var(--text3);font-size:12px;">yükleniyor...</div>
    </div>
    <button class="action-btn history-clear-btn" onclick="clearHistory()"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg><span id="clearHistoryTxt">geçmişi temizle</span></button>
  </div>
</main>
<input id="urlInput" type="url" hidden aria-hidden="true"><textarea id="urlTextarea" hidden aria-hidden="true"></textarea>
<div id="siteBottomNav" data-active="history"></div>
<div class="toast" id="toast"><div class="toast-dot" id="toastDot"></div><span id="toastTxt"></span></div>

<script src="app.d4596317c4a7.js?v=14.5"></script>
<script src="site-shell.js?v=14.3"></script>
<script>
window.reDownload=function(url){
  if(!url)return;
  try{sessionStorage.setItem('zw_pending_url',url);}catch(e){}
  location.href='/';
};
</script>
</body>
</html>

name: Security audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Python 3.12 kur
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements.lock
          python -m pip install --disable-pip-version-check bandit==1.8.6 pip-audit==2.9.0

      - name: Backend testlerini çalıştır
        working-directory: backend
        run: python -m unittest discover -s tests -v

      - name: Orta ve yüksek önem düzeyli kod bulgularını tara
        run: python -m bandit -q -r backend -x backend/tests -ll --skip B104

      - name: Python bağımlılıklarını güvenlik veritabanında tara
        run: python -m pip_audit -r backend/requirements.lock --disable-pip

      - name: CSP bütünlüğünü doğrula
        run: python scripts/update_csp.py --check

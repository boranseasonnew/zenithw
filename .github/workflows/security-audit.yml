name: Security audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Python 3.12 kur
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements.lock
          python -m pip install --disable-pip-version-check bandit==1.8.6 pip-audit==2.9.0

      - name: Verify Cloudflare cache outputs and boundaries
        run: |
          node scripts/build-cache-assets.mjs --check
          node --test tests/cloudflare-cache.test.mjs
          node --test tests/site-language.test.mjs tests/about-locales.test.mjs tests/updates-static.test.mjs tests/downloads-seo.test.mjs tests/workspace-choices.test.mjs tests/html-audit.test.mjs tests/typing-seo.test.mjs

      - name: Audit web and desktop dependency locks
        run: |
          npm ci --ignore-scripts
          npm run lint
          npm audit --audit-level=high
          npm audit --prefix desktop --audit-level=high

      - name: Verify real remux media and localized separator behavior
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm run test:media

      - name: Audit and verify the standalone promo project
        run: |
          npm ci --prefix promo-video --ignore-scripts
          npm audit --prefix promo-video --audit-level=high
          npm run lint --prefix promo-video
          npm run build --prefix promo-video

      - name: Verify desktop queue, persistence and security boundaries
        run: node --test tests/desktop-security.test.cjs desktop/tests/*.test.cjs

      - name: Verify Type permissions, scoring and avatar concurrency
        run: npm run test:typing

      - name: Backend testlerini çalıştır
        working-directory: backend
        run: python -m unittest discover -s tests -v

      - name: Orta ve yüksek önem düzeyli kod bulgularını tara
        run: python -m bandit -q -r backend -x backend/tests -ll --skip B104

      - name: Python bağımlılıklarını güvenlik veritabanında tara
        run: python -m pip_audit -r backend/requirements.lock --disable-pip

      - name: CSP bütünlüğünü doğrula
        run: python scripts/update_csp.py --check

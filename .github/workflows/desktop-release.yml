name: Build Windows desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          . ./desktop/scripts/rust-package-common.ps1
          $version = Get-ZenithVersion -Desktop ./desktop
          if ($env:REF_TYPE -eq 'tag' -and $env:REF_NAME -ne "v$version") {
            throw "The release tag must be v$version for this source tree."
          }
          "ZENITH_RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up the Rust MSVC toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage media tools and renderer assets
        shell: pwsh
        run: |
          & ./desktop/scripts/stage-release-tools.ps1 -CacheDirectory (Join-Path $env:RUNNER_TEMP 'zenith-tools')
          & ./desktop/scripts/prepare-rust.ps1 -UiOnly

      - name: Test and build Windows x64
        shell: pwsh
        run: |
          cargo +stable test --locked --manifest-path desktop/rust-core/Cargo.toml --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +stable test --locked --manifest-path desktop/native/Cargo.toml --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +stable build --locked --release --manifest-path desktop/native/Cargo.toml --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build installer and portable ZIP
        shell: pwsh
        run: |
          & ./desktop/scripts/package-rust.ps1 -ExePath desktop/native/target/x86_64-pc-windows-msvc/release/zenithw-desktop.exe

      - name: Upload release candidates and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ZenithW-${{ env.ZENITH_RELEASE_VERSION }}-Windows-x64
          if-no-files-found: error
          compression-level: 0
          path: |
            desktop/dist/Zenith-*-Windows-Setup.exe
            desktop/dist/Zenith-*-Windows.zip
            desktop/dist/SHA256SUMS.txt
